<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponto Comercial — seu negócio no litoral vai dar lucro?</title>
<meta name="description" content="Avaliador de pontos comerciais no litoral: fluxo sazonal, custo e ponto de equilíbrio. Satélite da rede praia.digital">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff7ed;color:#431407;min-height:100vh}
header{padding:24px;text-align:center;background:linear-gradient(120deg,#c2410c,#fb923c);color:#fff}
nav a{color:#ffedd5;margin:0 8px;text-decoration:none;font-size:14px;font-weight:600}
.wrap{max-width:720px;margin:auto;padding:24px}
.panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 6px 18px rgba(194,65,12,.12)}
label{display:block;margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:10px;border:2px solid #fed7aa;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:14px}
.kpi{background:#fff7ed;border-radius:12px;padding:14px}
.kpi b{display:block;font-size:20px;color:#c2410c}
.veredito{text-align:center;border-radius:12px;padding:16px;font-size:18px;font-weight:700;margin-top:14px}
footer{padding:20px;text-align:center;font-size:13px}
footer a{color:#c2410c}
</style></head>
<body>
<header><h1>🏪 Ponto Comercial</h1><p>Sorveteria na Enseada? Quiosque em Maresias? Faça a conta antes</p>
<nav><a href="https://praia.digital">Praia Digital</a><a href="https://praia.digital/marea">Maréa</a><a href="https://praia.digital/eventos-litoral">Eventos</a><a href="https://praia.digital/apps">Todos os apps</a></nav></header>
<div class="wrap"><div class="panel">
<label>📍 Cidade</label><select id="cid" onchange="calc()"><option value="2.2">Santos — Gonzaga (fluxo alto o ano todo)</option><option value="2.0">Guarujá — Pitangueiras</option><option value="1.6">São Sebastião — Maresias</option><option value="1.4">Caraguatatuba — Centro</option><option value="1.3">Ubatuba — Centro</option><option value="1.2">Praia Grande — Orla</option></select>
<label>💰 Aluguel do ponto (R$/mês)</label><input type="number" id="aluguel" value="6000" oninput="calc()">
<label>👥 Custos fixos totais (aluguel + folha + contas, R$/mês)</label><input type="number" id="fixos" value="22000" oninput="calc()">
<label>🛒 Ticket médio (R$)</label><input type="number" id="ticket" value="35" oninput="calc()">
<label>📊 Margem bruta (%)</label><input type="number" id="margem" value="60" oninput="calc()">
<div class="grid3"><div class="kpi">Vendas/dia p/ empatar<b id="pe">—</b></div><div class="kpi">Faturamento alvo/mês<b id="fat">—</b></div><div class="kpi">Mês de pico (x)<b id="pico">—</b></div></div>
<div class="veredito" id="veredito"></div></div>
</div>
<footer>Rede <a href="https://praia.digital">praia.digital</a> · <a href="https://praia.digital/preco-dinamico">Preço Dinâmico</a> · <a href="https://praia.digital/clima-litoral">Clima Litoral</a> · <a href="https://praia.digital/investidores">Investidores</a></footer>
<script>
function fmt(v){return 'R$ '+Math.round(v).toLocaleString('pt-BR')}
function calc(){
const f=+fixos.value,t=+ticket.value,m=+margem.value/100,fx=+cid.value;
const fatAlvo=f/m,vd=fatAlvo/t/30;
pe.textContent=Math.ceil(vd);fat.textContent=fmt(fatAlvo);
const pico=fx*3.2;pico.textContent='x'+pico.toFixed(1)+' em jan';
const ve=document.getElementById('veredito');
if(vd<80){ve.style.background='#dcfce7';ve.innerHTML=`✅ Ponto promissor: ${Math.ceil(vd)} vendas/dia de equilíbrio é alcançável com o fluxo desta cidade.`;}
else if(vd<200){ve.style.background='#fef9c3';ve.innerHTML=`🟡 Exige operação forte: ${Math.ceil(vd)} vendas/dia. Na baixa temporada o fluxo cai — reserve caixa de 6 meses de custo fixo (${fmt(f*6)}).`;}
else{ve.style.background='#fee2e2';ve.innerHTML=`🔴 Equilíbrio duro: ${Math.ceil(vd)} vendas/dia. Renegocie o aluguel ou reveja os custos fixos.`;}}
calc();
</script></body></html>
